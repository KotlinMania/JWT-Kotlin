name: CI

# Manual-only trigger. GitHub Actions on this repo runs only when Sydney
# explicitly dispatches it (Actions tab → CI → "Run workflow"). The old
# `push: [main]` + `pull_request: [main]` triggers fired a full CI matrix
# on every commit, which is the wrong cost shape for this workspace.
on:
  workflow_dispatch:

jobs:
  build-macos-arm64:
    name: Build and Test (macOS arm64 / iOS simulator arm64 / Swift)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.1.0

      - name: Build and test
        # Don't run `allTests` on macOS: it includes non-Apple Kotlin/Native targets
        # (e.g. linuxX64Test) which aren't meant to be linked/run here.
        run: ./gradlew macosArm64Test assembleJWTKMPXCFramework --no-configuration-cache

  build-linux:
    name: Build and Test (Linux / Android / JS / WASM)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.1.0

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Build and test
        # Prefer node-based JS/WASM tests in CI to avoid requiring a browser runner.
        run: ./gradlew jsNodeTest wasmJsNodeTest linuxX64Test --no-configuration-cache

  build-windows:
    name: Build and Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.1.0

      - name: Build and test
        run: ./gradlew mingwX64Test --no-configuration-cache
